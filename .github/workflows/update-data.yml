name: Update satellite data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and join CelesTrak data
        id: data
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Commit data if changed
        if: steps.data.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/sats.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update satellite data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Ask GitHub Pages to rebuild the site
        if: steps.data.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Report a failed data download
        if: steps.data.outcome != 'success'
        run: |
          echo "::error::CelesTrak download failed; the site was deployed with the previous data."
          exit 1
